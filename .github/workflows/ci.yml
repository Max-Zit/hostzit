# All checks in one workflow on every push and pull request: a newer push
# to the same branch cancels the older run, so a quick series of pushes
# gives one result (and at most one failure mail). security.yml repeats
# the security checks weekly for new CVEs.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal ./tools)" || (gofmt -l ./cmd ./internal ./tools; exit 1)
      - name: go vet
        run: go vet ./...
      - name: Tests
        run: go test -count=1 -timeout 20m ./...
      - name: Build for ARM64
        env:
          GOARCH: arm64
        run: go build -o /dev/null ./cmd/...

  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the whole history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          gosec -quiet ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: gitleaks (secrets in the history)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --redact --no-banner .

  race:
    name: Race detector (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fetch the test PostgreSQL once (parallel test binaries would all download it)
        run: go test -race -count=1 -run '^TestMain$' ./internal/web
      - name: Tests with -race
        run: go test -race -count=1 -timeout 50m ./...

  upgrade:
    name: Upgrade from the newest release (Debian 13)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Package of this commit
        run: |
          set -e
          V=99.0.0~ci${GITHUB_RUN_NUMBER}
          mkdir -p bin/pkg dist
          for p in hostzit-server hostzit-helper; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$V" -o bin/pkg/$p ./cmd/$p
          done
          VERSION=$V ARCH=amd64 go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0 package --config packaging/linux/nfpm.yaml --packager deb --target dist/
          ls -la dist/
      - name: Install the newest release, update to this commit, check
        run: bash tools/ci/upgrade-test.sh dist/hostzit_*_amd64.deb

  fuzz:
    name: Fuzz parsers of untrusted input (short)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz each target for 20 s
        run: |
          set -e
          # every Fuzz* function in the tests, so new targets run without
          # touching this file
          grep -rHo --include='*_test.go' '^func Fuzz[A-Za-z0-9_]*' internal cmd tools | sed 's/:func /:/' | sort -u |
          while IFS=: read -r file name; do
            echo "::group::$name ($(dirname "$file"))"
            go test "./$(dirname "$file")" -run '^$' -fuzz "^$name\$" -fuzztime 20s
            echo "::endgroup::"
          done
