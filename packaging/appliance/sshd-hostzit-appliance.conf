# HostZit appliance: no root sign-in over SSH.
PermitRootLogin no
# Only strong algorithms (ssh-audit clean apart from curve25519, which SFTP
# clients still need next to the post-quantum mlkem768/sntrup761):
#  - key exchange without the NIST curves,
#  - host keys Ed25519 and RSA (SHA-2), no ECDSA,
#  - no chacha20-poly1305 (Terrapin, CVE-2023-48795),
#  - MACs encrypt-then-MAC only, no 64-bit UMAC tags.
KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256
Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
