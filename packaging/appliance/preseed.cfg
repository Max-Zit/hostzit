# HostZit appliance: unattended Debian installation.
# The whole first disk is erased.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string hostzit
d-i netcfg/get_domain string
d-i netcfg/hostname string hostzit
d-i hw-detect/load_firmware boolean true

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# The administrator of the appliance's screen and SSH; it must choose a new
# password at its first sign-in.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string HostZit administrator
d-i passwd/username string hzadmin
d-i passwd/user-password password hostzit
d-i passwd/user-password-again password hostzit
d-i user-setup/allow-password-weak boolean true

d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# One volume for everything: account homes, databases and the panel share
# the disk; the appliance grows it when the virtual disk is enlarged.
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates
tasksel tasksel/first multiselect standard, ssh-server
# Everything HostZit drives, so the first start works without internet.
d-i pkgsel/include string openssl nginx libnginx-mod-http-modsecurity modsecurity-crs mariadb-server postgresql openssh-server quota curl ca-certificates unzip nftables fail2ban pdns-server pdns-backend-sqlite3 sqlite3 php-fpm php-cli php-mysql php-xml php-mbstring php-curl php-gd php-zip php-intl php-opcache php-imagick php-bcmath unattended-upgrades sudo whiptail systemd-resolved iputils-ping qemu-guest-agent open-vm-tools hyperv-daemons
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# HostZit from the ISO; the first start of the system finishes the setup.
d-i preseed/late_command string \
  cp -r /cdrom/hostzit /target/root/hostzit-install; \
  in-target sh /root/hostzit-install/appliance-install.sh

d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean false
